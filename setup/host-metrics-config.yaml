# OTel Collector Contrib sidecar — Sprite host metrics
#
# Collects system metrics from the Sprite host via /hostfs and forwards
# them to the signoz-otel-collector via OTLP gRPC on localhost:4317.
# The signoz-otel-collector then writes them to ClickHouse via the normal
# OTLP metrics pipeline, and they appear in SigNoz → Infrastructure → Hosts
# as the "sprite" host.
#
# Uses otel/opentelemetry-collector-contrib because the SigNoz custom
# collector image does not include the hostmetrics receiver.

receivers:
  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk: {}
      filesystem:
        exclude_mount_points:
          mount_points: [/hostfs/proc, /hostfs/sys, /hostfs/dev, /dev]
          match_type: strict
        exclude_fs_types:
          fs_types:
            - autofs
            - binfmt_misc
            - bpf
            - cgroup2
            - configfs
            - debugfs
            - devpts
            - devtmpfs
            - fusectl
            - hugetlbfs
            - iso9660
            - mqueue
            - nsfs
            - overlay
            - proc
            - procfs
            - pstore
            - rpc_pipefs
            - securityfs
            - selinuxfs
            - squashfs
            - sysfs
            - tracefs
          match_type: strict
      network:
        exclude:
          interfaces: [lo]
          match_type: strict
      load: {}
      processes: {}

processors:
  resourcedetection:
    detectors: [env, system]
    timeout: 2s
  batch:
    send_batch_size: 1000
    timeout: 10s

exporters:
  otlp:
    endpoint: localhost:4317
    tls:
      insecure: true

service:
  # Disable the default Prometheus metrics exporter — port 8888 is already
  # used by the signoz-otel-collector on the shared host network.
  telemetry:
    metrics:
      level: none
  pipelines:
    # Sprite host system metrics: CPU, memory, disk, network, load, processes.
    metrics/host:
      receivers: [hostmetrics]
      processors: [resourcedetection, batch]
      exporters: [otlp]
